services:

  proxy:
    image: traefik:v3.7
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB:-app}

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      # Enable Traefik for this service
      - traefik.enable=true
      # Route HTTP traffic for the Adminer subdomain
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      # Define the port inside of the Docker service to use
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  backend:
    env_file:
      - path: .env.ai
        required: false
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/${POSTGRES_DB:-app}
      BROWSER_TEST_MODE: ${BROWSER_TEST_MODE:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPCUA_ALLOWED_HOSTS: ${OPCUA_ALLOWED_HOSTS:-opcua-simulator,localhost,127.0.0.1}
      IMPORT_STORAGE_DIR: /data/imports
      IMPORT_MAX_FILE_SIZE_BYTES: ${IMPORT_MAX_FILE_SIZE_BYTES:-52428800}
    volumes:
      - import-data:/data/imports

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

  import-worker:
    image: backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.data_import.jobs"]
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/${POSTGRES_DB:-app}
      IMPORT_STORAGE_DIR: /data/imports
      IMPORT_JOB_RECOVERY_SECONDS: ${IMPORT_JOB_RECOVERY_SECONDS:-60}
      IMPORT_JOB_MAX_ATTEMPTS: ${IMPORT_JOB_MAX_ATTEMPTS:-3}
    volumes:
      - import-data:/data/imports:ro

  opcua-simulator:
    image: backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - -m
      - app.opcua.simulator
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/${POSTGRES_DB:-app}
      OPCUA_SIMULATOR_INTERVAL_MS: ${OPCUA_SIMULATOR_INTERVAL_MS:-500}
      OPCUA_SIMULATOR_ANOMALY_MODE: ${OPCUA_SIMULATOR_ANOMALY_MODE:-none}
      OPCUA_SIMULATOR_ANOMALY_AFTER_SECONDS: ${OPCUA_SIMULATOR_ANOMALY_AFTER_SECONDS:-60}
      OPCUA_SIMULATOR_ANOMALY_DURATION_SECONDS: ${OPCUA_SIMULATOR_ANOMALY_DURATION_SECONDS:-30}
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.opcua.healthcheck
        - opc.tcp://localhost:4840/industrial-dataops/server/
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 15s

  opcua-collector:
    image: backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
      opcua-simulator:
        condition: service_healthy
        restart: true
    command:
      - python
      - -m
      - app.opcua.collector
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/${POSTGRES_DB:-app}
      OPCUA_ALLOWED_HOSTS: ${OPCUA_ALLOWED_HOSTS:-opcua-simulator,localhost,127.0.0.1}
      OPCUA_CLIENT_TIMEOUT_SECONDS: ${OPCUA_CLIENT_TIMEOUT_SECONDS:-5}
      OPCUA_WORKER_POLL_SECONDS: ${OPCUA_WORKER_POLL_SECONDS:-1}
      OPCUA_WORKER_HEARTBEAT_SECONDS: ${OPCUA_WORKER_HEARTBEAT_SECONDS:-5}
      OPCUA_SAMPLE_QUEUE_SIZE: ${OPCUA_SAMPLE_QUEUE_SIZE:-10000}

volumes:
  app-db-data:
    name: ${DB_VOLUME_NAME:-${COMPOSE_PROJECT_NAME}_app-db-data}
    external: ${DB_VOLUME_EXTERNAL:-false}
  import-data:
